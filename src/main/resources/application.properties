spring.application.name=Capstone_backend
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

gemini.api.key=${GEMINI_API_KEY}

# Existing local model override remains supported via GEMINI_MODEL.
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# HIGH_END 예산 최대값. 0이면 상한 없음. 예: HIGH_END_MAX_BUDGET=8000000
capstone.high-end.max-budget=${HIGH_END_MAX_BUDGET:0}

# Gemini HTTP 호출 단위 제한: 연결 5초 / 응답 읽기 25초 (환경변수로 변경 가능)
capstone.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
capstone.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:25000}

# PDF 이메일 발송 (계정과 비밀번호는 환경변수로만 주입)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
capstone.mail.from=${MAIL_FROM:}
capstone.mail.pdf-font-path=${PDF_FONT_PATH:}
capstone.mail.rate-limit.per-ip=${MAIL_RATE_PER_IP:3}
capstone.mail.rate-limit.global=${MAIL_RATE_GLOBAL:60}

# 브라우저에서 생성한 다중 페이지 PDF를 메일로 첨부하기 위한 업로드 상한
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# CORS 허용 프론트엔드 주소
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}